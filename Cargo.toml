[package]
name = "memtree"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false
description = "Check, index, and diff a markdown memory store: notes with frontmatter, [[links]], and a MEMORY.md index."
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xendale/memtree"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
